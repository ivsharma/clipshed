appId: com.clipshed.app
productName: Clipshed
copyright: Copyright © 2026 Clipshed
directories:
  output: release
  buildResources: desktop/resources
files:
  - desktop/main.cjs
  - package.json
extraResources:
  - from: desktop/build/server.cjs
    to: server/server.cjs
  - from: web/dist
    to: web/dist
  - from: bin
    to: bin
    filter:
      - yt-dlp.exe
      - ffmpeg.exe
      - ffprobe.exe
      - qjs.exe
  - from: desktop/resources/icon.ico
    to: icon.ico
  - from: LICENSE
    to: LICENSE
  - from: desktop/resources/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
compression: normal
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: desktop/resources/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Clipshed
  installerIcon: desktop/resources/icon.ico
  uninstallerIcon: desktop/resources/icon.ico
portable:
  artifactName: ${productName}-${version}-portable.${ext}
