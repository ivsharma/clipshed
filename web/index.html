<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Clip an exact time range from YouTube videos as MP4 or MP3. Local-first and private."
    />
    <meta name="theme-color" content="#f1eee6" />
    <script>
      (function () {
        try {
          var match = document.cookie.match(/(?:^|; )clipshed_theme=([^;]*)/);
          var theme = match ? decodeURIComponent(match[1]) : localStorage.getItem("clipshed:theme");
          if (theme !== "dark" && theme !== "dark-contrast") theme = "light";
          document.documentElement.dataset.theme = theme;
          var colors = { light: "#f1eee6", dark: "#1d1a16", "dark-contrast": "#050505" };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", colors[theme]);
          if (window.ClipshedInsets && window.ClipshedInsets.setDarkTheme) {
            window.ClipshedInsets.setDarkTheme(theme !== "light");
          }
        } catch (error) {
          // Storage can be unavailable; the app still falls back to the light theme.
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ef4444'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M24 18v28l22-14z' fill='white'/%3E%3C/svg%3E"
    />
    <title>Clipshed — Video range clipper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
